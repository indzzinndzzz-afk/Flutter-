name: Build APK

on:
  push:
    branches:
      - build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Accept Android SDK licenses (force)
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install dependencies (ImageMagick, jq, unzip, curl)
        run: sudo apt-get update && sudo apt-get install -y imagemagick jq unzip curl

      - name: Install Gradle
        run: |
          curl -s "https://get.sdkman.io" | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install gradle 8.9
          sdk use gradle 8.9
          gradle --version

      - name: Read build config
        id: config
        run: |
          if [ -f build-config.json ]; then
            echo "type=$(jq -r .type build-config.json)" >> $GITHUB_ENV
            echo "url=$(jq -r .url build-config.json)" >> $GITHUB_ENV
            echo "app_name=$(jq -r .app_name build-config.json)" >> $GITHUB_ENV
            echo "build_type=$(jq -r .build_type build-config.json)" >> $GITHUB_ENV
            cat build-config.json
          else
            echo "type=unknown" >> $GITHUB_ENV
          fi

      - name: Generate keystore for signing (all builds)
        run: |
          keytool -genkey -v -keystore release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=BuildBot, OU=Dev, O=BuildBot, L=City, S=State, C=ID"

      # ============ WEB2APK SECTION (unchanged) ============
      - name: Web2APK - Create root gradle files
        if: env.type == 'web2apk'
        run: |
          mkdir -p project
          cat > project/build.gradle <<EOF
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.7.3'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF
          cat > project/settings.gradle <<EOF
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MyApp"
          include ':app'
          EOF
          cat > project/gradle.properties <<EOF
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Web2APK - Create app/build.gradle
        if: env.type == 'web2apk'
        run: |
          mkdir -p project/app
          cat > project/app/build.gradle <<EOF
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.web2apk.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.web2apk.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              signingConfigs {
                  debug {
                      storeFile file("debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
                  release {
                      storeFile file("debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.debug }
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.9.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.8.0'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
              implementation 'androidx.webkit:webkit:1.4.0'
          }
          EOF

      - name: Web2APK - Create Java source files
        if: env.type == 'web2apk'
        run: |
          mkdir -p project/app/src/main/java/com/web2apk/app
          cat > project/app/src/main/java/com/web2apk/app/MainActivity.java <<EOF
          package com.web2apk.app;
          import android.annotation.SuppressLint;
          import android.app.DownloadManager;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.view.View;
          import android.webkit.CookieManager;
          import android.webkit.DownloadListener;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.ProgressBar;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.appcompat.widget.Toolbar;
          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;
          public class MainActivity extends AppCompatActivity {
              private static final String WEBSITE_URL = "URL_PLACEHOLDER";
              private WebView webView;
              private ProgressBar progressBar;
              private SwipeRefreshLayout swipeRefreshLayout;
              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  webView = findViewById(R.id.webView);
                  progressBar = findViewById(R.id.progressBar);
                  swipeRefreshLayout = findViewById(R.id.swipeRefreshLayout);
                  Toolbar toolbar = findViewById(R.id.toolbar);
                  setSupportActionBar(toolbar);
                  if (getSupportActionBar() != null) {
                      getSupportActionBar().setTitle(getString(R.string.app_name));
                  }
                  setupWebView();
                  swipeRefreshLayout.setOnRefreshListener(() -> webView.reload());
                  webView.loadUrl(WEBSITE_URL);
              }
              @SuppressLint("SetJavaScriptEnabled")
              private void setupWebView() {
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  CookieManager cookieManager = CookieManager.getInstance();
                  cookieManager.setAcceptCookie(true);
                  cookieManager.setAcceptThirdPartyCookies(webView, true);
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          progressBar.setVisibility(View.GONE);
                          swipeRefreshLayout.setRefreshing(false);
                      }
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (url.startsWith("tel:") || url.startsWith("mailto:") || url.startsWith("intent:") || url.startsWith("whatsapp:")) {
                              try {
                                  startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                              } catch (Exception ignored) {}
                              return true;
                          }
                          return false;
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView view, int progress) {
                          progressBar.setProgress(progress);
                          if (progress >= 100) {
                              progressBar.setVisibility(View.GONE);
                          } else {
                              progressBar.setVisibility(View.VISIBLE);
                          }
                      }
                  });
                  webView.setDownloadListener(new DownloadListener() {
                      @Override
                      public void onDownloadStart(String url, String userAgent, String contentDisposition, String mimetype, long contentLength) {
                          DownloadManager.Request request = new DownloadManager.Request(Uri.parse(url));
                          request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                          request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, contentDisposition);
                          DownloadManager dm = (DownloadManager) getSystemService(DOWNLOAD_SERVICE);
                          dm.enqueue(request);
                      }
                  });
                  webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);
              }
              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                      return;
                  }
                  super.onBackPressed();
              }
              @Override
              protected void onResume() {
                  if (webView != null) webView.onResume();
              }
              @Override
              protected void onPause() {
                  if (webView != null) webView.onPause();
                  super.onPause();
              }
              @Override
              protected void onDestroy() {
                  if (webView != null) webView.destroy();
                  super.onDestroy();
              }
          }
          EOF
          cat > project/app/src/main/java/com/web2apk/app/SplashActivity.java <<EOF
          package com.web2apk.app;
          import android.content.Intent;
          import android.os.Bundle;
          import android.os.Handler;
          import androidx.appcompat.app.AppCompatActivity;
          public class SplashActivity extends AppCompatActivity {
              private static final int SPLASH_DELAY = 1800;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_splash);
                  new Handler().postDelayed(() -> {
                      Intent intent = new Intent(SplashActivity.this, MainActivity.class);
                      startActivity(intent);
                      finish();
                  }, SPLASH_DELAY);
              }
          }
          EOF

      - name: Web2APK - Create AndroidManifest.xml and layouts
        if: env.type == 'web2apk'
        run: |
          mkdir -p project/app/src/main/res/layout
          mkdir -p project/app/src/main/res/values
          cat > project/app/src/main/AndroidManifest.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".SplashActivity"
                      android:exported="true"
                      android:theme="@style/SplashTheme">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".MainActivity"
                      android:exported="false"
                      android:launchMode="singleTop"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode" />
              </application>
          </manifest>
          EOF
          cat > project/app/src/main/res/layout/activity_main.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical">
              <androidx.appcompat.widget.Toolbar
                  android:id="@+id/toolbar"
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:background="#000000"
                  app:titleTextColor="#FFFFFF"/>
              <ProgressBar
                  android:id="@+id/progressBar"
                  style="?android:attr/progressBarStyleHorizontal"
                  android:layout_width="match_parent"
                  android:layout_height="4dp"
                  android:max="100"/>
              <androidx.swiperefreshlayout.widget.SwipeRefreshLayout
                  android:id="@+id/swipeRefreshLayout"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent">
                  <WebView
                      android:id="@+id/webView"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"/>
              </androidx.swiperefreshlayout.widget.SwipeRefreshLayout>
          </LinearLayout>
          EOF
          cat > project/app/src/main/res/layout/activity_splash.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000">
              <LinearLayout
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_centerInParent="true"
                  android:gravity="center"
                  android:orientation="vertical">
                  <ImageView
                      android:id="@+id/splashLogo"
                      android:layout_width="120dp"
                      android:layout_height="120dp"
                      android:src="@mipmap/ic_launcher" />
                  <TextView
                      android:id="@+id/splashAppName"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="@string/app_name"
                      android:textSize="26sp"
                      android:textStyle="bold"
                      android:textColor="#FFFFFF"
                      android:layout_marginTop="20dp" />
                  <ProgressBar
                      android:id="@+id/splashProgress"
                      android:layout_width="40dp"
                      android:layout_height="40dp"
                      android:layout_marginTop="30dp" />
              </LinearLayout>
          </RelativeLayout>
          EOF
          cat > project/app/src/main/res/values/colors.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#000000</color>
              <color name="colorPrimaryDark">#000000</color>
              <color name="colorAccent">#2196F3</color>
              <color name="white">#FFFFFF</color>
              <color name="black">#000000</color>
          </resources>
          EOF
          cat > project/app/src/main/res/values/strings.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">AppName</string>
              <string name="loading">Loading...</string>
          </resources>
          EOF
          cat > project/app/src/main/res/values/styles.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
              <style name="SplashTheme" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
              </style>
          </resources>
          EOF

      - name: Web2APK - Apply URL, app name, icons, and keystore
        if: env.type == 'web2apk'
        run: |
          sed -i "s|URL_PLACEHOLDER|${{ env.url }}|g" project/app/src/main/java/com/web2apk/app/MainActivity.java
          sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">${{ env.app_name }}</string>|g" project/app/src/main/res/values/strings.xml
          if [ ! -f build-assets/icon.png ] || ! file build-assets/icon.png | grep -q PNG; then
            echo "⚠️ Icon tidak valid, membuat default..."
            convert -size 512x512 xc:blue build-assets/icon.png
          fi
          mkdir -p project/app/src/main/res/mipmap-hdpi project/app/src/main/res/mipmap-mdpi project/app/src/main/res/mipmap-xhdpi project/app/src/main/res/mipmap-xxhdpi project/app/src/main/res/mipmap-xxxhdpi
          convert build-assets/icon.png -resize 72x72 project/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert build-assets/icon.png -resize 48x48 project/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert build-assets/icon.png -resize 96x96 project/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert build-assets/icon.png -resize 144x144 project/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert build-assets/icon.png -resize 192x192 project/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp project/app/src/main/res/mipmap-hdpi/ic_launcher.png project/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp project/app/src/main/res/mipmap-mdpi/ic_launcher.png project/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp project/app/src/main/res/mipmap-xhdpi/ic_launcher.png project/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp project/app/src/main/res/mipmap-xxhdpi/ic_launcher.png project/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp project/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png project/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          rm -f project/app/debug.keystore
          keytool -genkey -v -keystore project/app/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug, O=Android, C=US"

      - name: Web2APK - Build
        if: env.type == 'web2apk'
        run: |
          cd project
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          gradle assembleRelease

      - name: Web2APK - Sign APK
        if: env.type == 'web2apk'
        run: |
          APK_PATH=$(find project/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            echo "Menandatangani Web2APK APK: $APK_PATH"
            $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -n1)/apksigner sign --ks release.keystore --ks-pass pass:password --key-pass pass:password "$APK_PATH"
            echo "Verifikasi tanda tangan Web2APK:"
            $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -n1)/apksigner verify "$APK_PATH"
          else
            echo "APK Web2APK tidak ditemukan, skip signing"
          fi

      # ============ FLUTTER SECTION WITH FIX ============

      - name: Prepare Flutter project
        if: env.type == 'flutter'
        run: |
          rm -rf flutter-project
          mkdir -p flutter-project
          unzip -q flutter-project.zip -d flutter-project

          # Kalau zip berisi 1 folder utama, ratakan isinya
          FIRST_DIR=$(find flutter-project -mindepth 1 -maxdepth 1 -type d | head -n 1)
          ROOT_FILES=$(find flutter-project -mindepth 1 -maxdepth 1 | wc -l)

          if [ "$ROOT_FILES" = "1" ] && [ -n "$FIRST_DIR" ] && [ -f "$FIRST_DIR/pubspec.yaml" ]; then
            TMP_DIR=$(mktemp -d)
            cp -R "$FIRST_DIR"/. "$TMP_DIR"/
            rm -rf flutter-project
            mkdir -p flutter-project
            cp -R "$TMP_DIR"/. flutter-project/
          fi

          if [ ! -f flutter-project/pubspec.yaml ]; then
            echo "pubspec.yaml tidak ditemukan"
            exit 1
          fi

      - name: Detect Flutter version from pubspec
        if: env.type == 'flutter'
        id: flutter_detect
        shell: bash
        run: |
          set -e
          PUBSPEC="flutter-project/pubspec.yaml"

          # Baca SDK constraint
          SDK_LINE=$(grep -A2 '^environment:' "$PUBSPEC" | grep 'sdk:' | head -n1 | sed 's/.*sdk:[[:space:]]*//; s/["\'\'']//g' || true)
          echo "Detected SDK constraint: $SDK_LINE"

          # Default untuk kompatibilitas luas
          FLUTTER_VERSION="3.24.0"  # default

          # Function untuk extract major.minor dari SDK constraint
          get_dart_version() {
            echo "$1" | grep -oE '[0-9]+\.[0-9]+' | head -n1
          }

          DART_VERSION=$(get_dart_version "$SDK_LINE")
          echo "Extracted Dart version: $DART_VERSION"

          # Mapping Dart version ke Flutter version
          if [ -n "$DART_VERSION" ]; then
            case "$DART_VERSION" in
              "3.15"*) FLUTTER_VERSION="3.35.2" ;;
              "3.14"*) FLUTTER_VERSION="3.35.2" ;;
              "3.13"*) FLUTTER_VERSION="3.35.2" ;;
              "3.12"*) FLUTTER_VERSION="3.35.2" ;;
              "3.11"*) FLUTTER_VERSION="3.35.2" ;;
              "3.10"*) FLUTTER_VERSION="3.35.2" ;;
              "3.9"*)  FLUTTER_VERSION="3.35.2" ;;
              "3.8"*)  FLUTTER_VERSION="3.35.2" ;;
              "3.7"*)  FLUTTER_VERSION="3.29.0" ;;
              "3.6"*)  FLUTTER_VERSION="3.27.0" ;;
              "3.5"*)  FLUTTER_VERSION="3.24.0" ;;
              "3.4"*)  FLUTTER_VERSION="3.22.0" ;;
              "3.3"*)  FLUTTER_VERSION="3.19.0" ;;
              "3.2"*)  FLUTTER_VERSION="3.16.0" ;;
              "3.1"*)  FLUTTER_VERSION="3.16.0" ;;  # FIX: Minimal 3.16.0 untuk kompatibilitas
              "3.0"*)  FLUTTER_VERSION="3.22.0" ;;
              *)       FLUTTER_VERSION="3.24.0" ;;
            esac
          fi

          # Cek plugin dependencies yang butuh Flutter lebih tinggi (overwrite jika perlu)
          if grep -Eq 'webview_flutter:[[:space:]]*(\^|>=)?4\.(1[5-9]|[2-9][0-9])' "$PUBSPEC" || \
             grep -Eq 'webview_flutter:[[:space:]]*(\^|>=)?5\.' "$PUBSPEC" || \
             grep -Eq 'google_maps_flutter:[[:space:]]*(\^|>=)?2\.(1[0-9]|[2-9][0-9])' "$PUBSPEC" || \
             grep -Eq 'google_maps_flutter:[[:space:]]*(\^|>=)?3\.' "$PUBSPEC" || \
             grep -Eq 'firebase_core:[[:space:]]*(\^|>=)?3\.' "$PUBSPEC" || \
             grep -Eq 'firebase_[a-z_]+:[[:space:]]*(\^|>=)?3\.' "$PUBSPEC" || \
             grep -Eq 'permission_handler:[[:space:]]*(\^|>=)?12\.' "$PUBSPEC"; then
            FLUTTER_VERSION="3.35.2"
          fi

          echo "FLUTTER_VERSION=$FLUTTER_VERSION" >> $GITHUB_ENV
          echo "flutter_version=$FLUTTER_VERSION" >> $GITHUB_OUTPUT
          echo "Using Flutter $FLUTTER_VERSION"

      - name: Setup Flutter SDK
        if: env.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # ============ NEW STEP: FIX GRADLE FILES ============
      - name: Fix Flutter Gradle files for compatibility
        if: env.type == 'flutter'
        shell: bash
        run: |
          cd flutter-project

          echo "=== Fixing Gradle files ==="

          # ====== FIX 1: settings.gradle ======
          if [ -f "android/settings.gradle" ]; then
            echo "✓ Fixing android/settings.gradle..."
            cp android/settings.gradle android/settings.gradle.bak

            # Get Flutter version
            FLUTTER_VER=$(flutter --version 2>/dev/null | head -n1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || echo "3.24.0")
            FLUTTER_MINOR=$(echo "$FLUTTER_VER" | cut -d. -f2)

            # Check if using modern gradle format
            if grep -q "flutter-plugin-loader" android/settings.gradle; then
              echo "✓ Detected modern settings.gradle with flutter-plugin-loader"

              # Jika Flutter < 3.16, konversi ke legacy format
              if [ -n "$FLUTTER_MINOR" ] && [ "$FLUTTER_MINOR" -lt 16 ] 2>/dev/null; then
                echo "⚠️ Flutter $FLUTTER_VER < 3.16, converting to legacy settings.gradle..."
                cat > android/settings.gradle << 'EOF'
          include ':app'

          def localPropertiesFile = new File(rootProject.projectDir, "local.properties")
          def properties = new Properties()

          assert localPropertiesFile.exists()
          localPropertiesFile.withReader("UTF-8") { reader -> properties.load(reader) }

          def flutterSdkPath = properties.getProperty("flutter.sdk")
          assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
          apply from: "$flutterSdkPath/packages/flutter_tools/gradle/app_plugin_loader.gradle"
          EOF
                echo "✓ Converted to legacy settings.gradle"
              else
                echo "✓ Flutter $FLUTTER_VER is compatible with modern settings.gradle"
              fi
            else
              echo "✓ Using legacy settings.gradle"

              # Jika Flutter >= 3.16, upgrade ke modern format
              if [ -n "$FLUTTER_MINOR" ] && [ "$FLUTTER_MINOR" -ge 16 ] 2>/dev/null; then
                echo "⚠️ Flutter $FLUTTER_VER >= 3.16, upgrading to modern settings.gradle..."
                cat > android/settings.gradle << 'EOF'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()

              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.6.0" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }

          include ":app"
          EOF
                echo "✓ Upgraded to modern settings.gradle"
              fi
            fi
          fi

          # ====== FIX 2: build.gradle ======
          if [ -f "android/build.gradle" ]; then
            echo "✓ Fixing android/build.gradle..."
            cp android/build.gradle android/build.gradle.bak

            # Add google-services classpath if missing
            if ! grep -q "google-services" android/build.gradle; then
              echo "✓ Adding google-services classpath"
              sed -i '/dependencies {/a\\        classpath "com.google.gms:google-services:4.4.2"' android/build.gradle
            fi
          fi

          # ====== FIX 3: app/build.gradle ======
          if [ -f "android/app/build.gradle" ]; then
            echo "✓ Fixing android/app/build.gradle..."
            cp android/app/build.gradle android/app/build.gradle.bak

            # Update SDK versions
            sed -i 's/minSdkVersion .*/minSdkVersion 21/' android/app/build.gradle
            sed -i 's/compileSdkVersion .*/compileSdkVersion 34/' android/app/build.gradle
            sed -i 's/targetSdkVersion .*/targetSdkVersion 34/' android/app/build.gradle

            # Add kotlinOptions if missing
            if ! grep -q "kotlinOptions" android/app/build.gradle; then
              echo "✓ Adding kotlinOptions"
              sed -i '/android {/a\\    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n\n    kotlinOptions {\n        jvmTarget = "17"\n    }' android/app/build.gradle
            fi

            # Add signing config if missing (cek spesifik signingConfigs.release, bukan cuma keyword signingConfigs)
            if ! grep -qP 'signingConfigs\s*\{' android/app/build.gradle; then
              echo "✓ Adding signingConfigs (release)"
              sed -i '/android {/a\\    signingConfigs {\n        release {\n            storeFile file("../../release.keystore")\n            storePassword "password"\n            keyAlias "release"\n            keyPassword "password"\n        }\n    }' android/app/build.gradle
            elif ! grep -qP '^\s*release\s*\{' android/app/build.gradle; then
              echo "✓ signingConfigs ada tapi tidak ada blok 'release', menambahkan..."
              sed -i '/signingConfigs\s*{/a\\        release {\n            storeFile file("../../release.keystore")\n            storePassword "password"\n            keyAlias "release"\n            keyPassword "password"\n        }' android/app/build.gradle
            else
              echo "✓ signingConfigs.release sudah ada, tidak diubah"
            fi

            # Ensure buildTypes release menggunakan signingConfigs.release (hanya jika belum dirujuk sama sekali)
            if grep -q "buildTypes" android/app/build.gradle && ! grep -q "signingConfig signingConfigs" android/app/build.gradle; then
              echo "✓ Menambahkan signingConfig ke buildTypes.release"
              awk '
                /buildTypes[[:space:]]*\{/ { in_buildtypes=1 }
                in_buildtypes && /release[[:space:]]*\{/ && !done {
                  print
                  print "            signingConfig signingConfigs.release"
                  done=1
                  next
                }
                { print }
              ' android/app/build.gradle > android/app/build.gradle.tmp && mv android/app/build.gradle.tmp android/app/build.gradle
            else
              echo "ℹ️ buildTypes sudah merujuk signingConfig, tidak diubah (mencegah duplikasi)"
            fi
          fi

          # ====== FIX 4: gradle-wrapper.properties ======
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "✓ Fixing gradle-wrapper.properties..."

            # Deteksi versi AGP yang dideklarasikan project (modern atau legacy settings.gradle)
            AGP_VERSION=""
            if [ -f "android/settings.gradle" ]; then
              AGP_VERSION=$(grep -oP '"com\.android\.application"\s+version\s+"\K[0-9]+\.[0-9]+\.[0-9]+' android/settings.gradle || true)
            fi
            if [ -z "$AGP_VERSION" ] && [ -f "android/build.gradle" ]; then
              AGP_VERSION=$(grep -oP "com\.android\.tools\.build:gradle:\K[0-9]+\.[0-9]+\.[0-9]+" android/build.gradle || true)
            fi

            AGP_MAJOR_MINOR=$(echo "$AGP_VERSION" | grep -oE '^[0-9]+\.[0-9]+' || true)
            echo "Detected AGP version: ${AGP_VERSION:-none} (major.minor: ${AGP_MAJOR_MINOR:-none})"

            # Mapping AGP -> minimum Gradle yang dibutuhkan
            case "$AGP_MAJOR_MINOR" in
              "8.9"|"8.10"|"8.11") GRADLE_VERSION="8.11.1" ;;
              "8.7"|"8.8")          GRADLE_VERSION="8.9" ;;
              "8.5"|"8.6")          GRADLE_VERSION="8.7" ;;
              "8.3"|"8.4")          GRADLE_VERSION="8.4" ;;
              "8.0"|"8.1"|"8.2")    GRADLE_VERSION="8.0" ;;
              "7."*)                GRADLE_VERSION="7.5" ;;
              *)                    GRADLE_VERSION="8.11.1" ;;  # default aman untuk AGP modern/unknown
            esac

            echo "✓ Menggunakan Gradle $GRADLE_VERSION (cocok untuk AGP ${AGP_VERSION:-default})"
            sed -i "s|distributionUrl=.*|distributionUrl=https\\\\://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-all.zip|" android/gradle/wrapper/gradle-wrapper.properties
          fi

          echo "=== Gradle fix completed ==="

      - name: Build Flutter APK with auto-detection and auto-fix
        if: env.type == 'flutter'
        shell: bash
        run: |
          set -e
          cd flutter-project

          echo "=== Flutter Version ==="
          flutter --version
          echo "========================"

          PUB_LOG="../pubget.log"
          BUILD_MODE="${{ env.build_type }}"
          MAX_RETRIES=5
          RETRY_COUNT=0
          SUCCESS=false

          # Function to try flutter pub get
          try_pub_get() {
            flutter pub get 2>&1 | tee "$PUB_LOG"
            return ${PIPESTATUS[0]}
          }

          # Function to detect and fix issues
          auto_fix_pubspec() {
            local FIXED=false

            echo "=== Auto-fixing pubspec.yaml ==="

            # Fix SDK constraint
            if grep -q "requires SDK version" "$PUB_LOG" || grep -q "requires Dart SDK version" "$PUB_LOG" || grep -q "requires Flutter SDK version" "$PUB_LOG"; then
              echo "Fix: Menurunkan SDK constraint ke >=3.0.0"
              sed -i -E "s/^([[:space:]]*sdk:[[:space:]]*)(\'|\")(>=|\^)[^\'\"]+(\'|\")/\1\'>=3.0.0 <4.0.0\'/" pubspec.yaml || true
              FIXED=true
            fi

            # Fix url_launcher
            if grep -q "url_launcher" "$PUB_LOG" && grep -q "requires SDK version" "$PUB_LOG"; then
              echo "Fix: Menurunkan url_launcher ke 6.1.14"
              sed -i -E 's/url_launcher:[[:space:]]*[^[:space:]]*/url_launcher: ^6.1.14/' pubspec.yaml || true
              FIXED=true
            fi

            # Fix google_fonts
            if grep -q "google_fonts" "$PUB_LOG" && grep -q "requires Flutter SDK version" "$PUB_LOG"; then
              echo "Fix: Menurunkan google_fonts ke 5.1.0"
              sed -i -E 's/google_fonts:[[:space:]]*[^[:space:]]*/google_fonts: ^5.1.0/' pubspec.yaml || true
              FIXED=true
            fi

            # Fix webview_flutter
            if grep -q "webview_flutter" "$PUB_LOG" && grep -q "requires SDK version" "$PUB_LOG"; then
              echo "Fix: Menurunkan webview_flutter ke 4.13.0"
              sed -i -E 's/webview_flutter:[[:space:]]*[^[:space:]]*/webview_flutter: ^4.13.0/' pubspec.yaml || true
              FIXED=true
            fi

            # Fix firebase_core
            if grep -q "firebase_core" "$PUB_LOG" && grep -q "requires SDK version" "$PUB_LOG"; then
              echo "Fix: Menurunkan firebase_core"
              sed -i -E 's/firebase_core:[[:space:]]*[^[:space:]]*/firebase_core: ^2.32.0/' pubspec.yaml || true
              sed -i -E 's/(firebase_[a-z_]+):[[:space:]]*[^[:space:]]*/\1: ^2.32.0/' pubspec.yaml || true
              FIXED=true
            fi

            # Fix video_player
            if grep -q "video_player" "$PUB_LOG" && grep -q "requires SDK version" "$PUB_LOG"; then
              echo "Fix: Menurunkan video_player ke 2.7.0"
              sed -i -E 's/video_player:[[:space:]]*[^[:space:]]*/video_player: ^2.7.0/' pubspec.yaml || true
              FIXED=true
            fi

            # Fix permission_handler
            if grep -q "permission_handler" "$PUB_LOG" && grep -q "requires SDK version" "$PUB_LOG"; then
              echo "Fix: Menurunkan permission_handler"
              sed -i -E 's/permission_handler:[[:space:]]*[^[:space:]]*/permission_handler: ^11.3.1/' pubspec.yaml || true
              FIXED=true
            fi

            # Fix image_picker
            if grep -q "image_picker" "$PUB_LOG" && grep -q "requires SDK version" "$PUB_LOG"; then
              echo "Fix: Menurunkan image_picker"
              sed -i -E 's/image_picker:[[:space:]]*[^[:space:]]*/image_picker: ^1.1.2/' pubspec.yaml || true
              FIXED=true
            fi

            # Fix audioplayers
            if grep -q "audioplayers" "$PUB_LOG" && grep -q "requires SDK version" "$PUB_LOG"; then
              echo "Fix: Menurunkan audioplayers ke 5.2.1"
              sed -i -E 's/audioplayers:[[:space:]]*[^[:space:]]*/audioplayers: ^5.2.1/' pubspec.yaml || true
              FIXED=true
            fi

            # Fix shared_preferences
            if grep -q "shared_preferences" "$PUB_LOG" && grep -q "requires SDK version" "$PUB_LOG"; then
              echo "Fix: Menurunkan shared_preferences"
              sed -i -E 's/shared_preferences:[[:space:]]*[^[:space:]]*/shared_preferences: ^2.2.2/' pubspec.yaml || true
              FIXED=true
            fi

            # Fix flutter_local_notifications
            if grep -q "flutter_local_notifications" "$PUB_LOG" && grep -q "requires SDK version" "$PUB_LOG"; then
              echo "Fix: Menurunkan flutter_local_notifications"
              sed -i -E 's/flutter_local_notifications:[[:space:]]*[^[:space:]]*/flutter_local_notifications: ^16.3.3/' pubspec.yaml || true
              FIXED=true
            fi

            # Fix dio
            if grep -q "dio" "$PUB_LOG" && grep -q "requires SDK version" "$PUB_LOG"; then
              echo "Fix: Menurunkan dio"
              sed -i -E 's/dio:[[:space:]]*[^[:space:]]*/dio: ^5.4.3/' pubspec.yaml || true
              FIXED=true
            fi

            # Fix get / getx
            if grep -q " get " "$PUB_LOG" && grep -q "requires SDK version" "$PUB_LOG"; then
              echo "Fix: Menurunkan get"
              sed -i -E 's/^([[:space:]]*)get:[[:space:]]*[^[:space:]]*/get: ^4.6.6/' pubspec.yaml || true
              FIXED=true
            fi

            # Generic fallback: kalau masih conflict setelah fix specific, naikkan flutter version
            if grep -q "requires Flutter SDK version" "$PUB_LOG" || grep -q "requires Dart SDK version" "$PUB_LOG"; then
              echo "Fix: Force upgrade Flutter version ke 3.24.0"
              echo "FLUTTER_VERSION=3.24.0" >> $GITHUB_ENV || true
              FIXED=true
            fi

            if [ "$FIXED" = true ]; then
              echo "✅ Pubspec telah di-fix"
              rm -f pubspec.lock
            else
              echo "ℹ️ Tidak ada perbaikan yang diperlukan"
            fi
          }

          # Function to regenerate android folder if unsupported gradle project
          fix_unsupported_gradle() {
            echo "🔧 Detected unsupported Gradle project, regenerating android folder..."
            
            # Backup existing android folder
            mv android android_backup 2>/dev/null || true

            # Create flutter project template to get clean android folder
            cd ..
            flutter create --org com.buildbot --project-name flutter_tmp _tmp_flutter_template 2>/dev/null || true
            
            if [ -d "_tmp_flutter_template/android" ]; then
              cp -R _tmp_flutter_template/android flutter-project/android
              echo "✅ Android folder regenerated from template"
              
              # Restore app-specific files from backup
              if [ -d "flutter-project/android_backup/app/src/main" ]; then
                # Keep user's AndroidManifest if exists
                if [ -f "flutter-project/android_backup/app/src/main/AndroidManifest.xml" ]; then
                  cp flutter-project/android_backup/app/src/main/AndroidManifest.xml flutter-project/android/app/src/main/AndroidManifest.xml 2>/dev/null || true
                  echo "✅ AndroidManifest.xml restored"
                fi
                # Keep user's kotlin/java source
                if [ -d "flutter-project/android_backup/app/src/main/kotlin" ]; then
                  cp -R flutter-project/android_backup/app/src/main/kotlin flutter-project/android/app/src/main/ 2>/dev/null || true
                fi
                if [ -d "flutter-project/android_backup/app/src/main/java" ]; then
                  cp -R flutter-project/android_backup/app/src/main/java flutter-project/android/app/src/main/ 2>/dev/null || true
                fi
                # Keep res folder
                if [ -d "flutter-project/android_backup/app/src/main/res" ]; then
                  cp -R flutter-project/android_backup/app/src/main/res flutter-project/android/app/src/main/ 2>/dev/null || true
                fi
              fi
              
              # Get original applicationId if exists
              ORIG_APP_ID=""
              if [ -f "flutter-project/android_backup/app/build.gradle" ]; then
                ORIG_APP_ID=$(grep -oP '(?<=applicationId ")[^"]+' flutter-project/android_backup/app/build.gradle | head -n1 || true)
              fi
              if [ -z "$ORIG_APP_ID" ] && [ -f "flutter-project/android_backup/app/build.gradle" ]; then
                ORIG_APP_ID=$(grep -oP "(?<=applicationId ')[^']+" flutter-project/android_backup/app/build.gradle | head -n1 || true)
              fi
              
              if [ -n "$ORIG_APP_ID" ]; then
                sed -i "s/com\.example\.flutter_tmp/$ORIG_APP_ID/g" flutter-project/android/app/build.gradle 2>/dev/null || true
                sed -i "s/com\.example\.flutter_tmp/$ORIG_APP_ID/g" flutter-project/android/app/src/main/AndroidManifest.xml 2>/dev/null || true
                echo "✅ applicationId restored: $ORIG_APP_ID"
              fi
              
              rm -rf _tmp_flutter_template
            else
              echo "⚠️ Template generation failed, restoring backup"
              mv flutter-project/android_backup flutter-project/android 2>/dev/null || true
            fi
            
            cd flutter-project
            rm -rf android_backup 2>/dev/null || true
          }

          # Main build loop with retries
          while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$SUCCESS" = false ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "=== Attempt $RETRY_COUNT of $MAX_RETRIES ==="

            # Try flutter pub get
            if try_pub_get; then
              echo "✅ flutter pub get succeeded"

              # Try build
              if [ "$BUILD_MODE" = "release" ]; then
                BUILD_LOG="../build_attempt_${RETRY_COUNT}.log"
                if flutter build apk --release 2>&1 | tee "$BUILD_LOG"; then
                  SUCCESS=true
                  echo "✅ Build successful!"
                  break
                else
                  echo "❌ Build failed, attempting to fix..."
                  cat "$BUILD_LOG" >> "$PUB_LOG" || true
                  # Deteksi unsupported Gradle project
                  if grep -q "unsupported Gradle project" "$BUILD_LOG"; then
                    fix_unsupported_gradle
                  fi
                  auto_fix_pubspec
                  rm -rf build .dart_tool
                fi
              else
                BUILD_LOG="../build_attempt_${RETRY_COUNT}.log"
                if flutter build apk --debug 2>&1 | tee "$BUILD_LOG"; then
                  SUCCESS=true
                  echo "✅ Build successful!"
                  break
                else
                  echo "❌ Build failed, attempting to fix..."
                  cat "$BUILD_LOG" >> "$PUB_LOG" || true
                  # Deteksi unsupported Gradle project
                  if grep -q "unsupported Gradle project" "$BUILD_LOG"; then
                    fix_unsupported_gradle
                  fi
                  auto_fix_pubspec
                  rm -rf build .dart_tool
                fi
              fi
            else
              echo "❌ flutter pub get failed, attempting to fix..."
              auto_fix_pubspec
              rm -f pubspec.lock
            fi
          done

          if [ "$SUCCESS" = false ]; then
            echo "❌ Build failed after $MAX_RETRIES attempts"
            echo "Last pub get output:"
            cat "$PUB_LOG" || true
            exit 1
          fi

      - name: Sign Flutter APK (only release)
        if: env.type == 'flutter' && env.build_type == 'release'
        run: |
          APK_PATH=$(find flutter-project/build/app/outputs/flutter-apk -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            echo "Menandatangani Flutter Release APK: $APK_PATH"
            $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -n1)/apksigner sign --ks release.keystore --ks-pass pass:password --key-pass pass:password "$APK_PATH"
            echo "Verifikasi tanda tangan Flutter Release:"
            $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -n1)/apksigner verify "$APK_PATH"
          else
            echo "APK Flutter release tidak ditemukan, skip signing"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: |
            project/app/build/outputs/apk/release/*.apk
            flutter-project/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error